# CAI CADRE — nginx în spatele tunelului Cloudflare. TLS se termină la margine, aici
# se vorbește doar HTTP simplu pe rețeaua compose / portul local 127.0.0.1:3960.
#
# Totul merge prin proxy la aplicație (serviciul `app`, portul 8000). Folderul
# deploy/nginx e montat întreg în /etc/nginx/conf.d, deci după o editare ajunge
#   docker compose exec web nginx -t && docker compose exec web nginx -s reload

# HSTS doar pe răspunsurile care au venit prin HTTPS (valoare goală = antetul nu se pune).
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}

# Marginea pune X-Forwarded-Proto (https); îl trecem mai departe ca aplicația
# să vadă schema reală. Verificările locale (fără antet) cad pe schema reală.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# IP-ul real al vizitatorului în jurnalul nginx: cererile vin de la `cloudflared` (rețeaua
# compose) sau, la verificările locale, prin portul de pe 127.0.0.1 — ambele din rețele private.
real_ip_header CF-Connecting-IP;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;

# Cererile venite prin tunel au mereu CF-Connecting-IP: îl pune marginea Cloudflare și
# vizitatorul nu-l poate scoate. Verificările locale (127.0.0.1:3960, tunel SSH) nu-l au.
map $http_cf_connecting_ip $from_edge {
    ""      0;
    default 1;
}

# Ce nu se deschide din internet (404 prin tunel; local merge, vezi docs/instalare.md):
#   /__platform/… — lista bazelor și consola serverului CAI CADRE (launcher.py): administrarea
#                   serverului, apărată doar de o parolă, fără limită de încercări;
#   /api/setup/…  — asistentul de instalare, în afară de status/ (interfața îl citește la
#                   fiecare deschidere). După instalare aplicația îl refuză oricum, dar pe o
#                   bază nouă primul venit din internet și-ar crea administratorul.
# Pe $uri — calea decodată și normalizată (%5F, //), ca s-o prindă în orice scriere.
map "$from_edge:$uri" $edge_denied {
    "~^1:/__platform(/|$)"          1;
    "~^1:/api/setup/(?!status/$)"   1;
    default                         0;
}

# Segmentele „.” și „..” în calea brută (și codate, %2e): browserele nu le trimit niciodată.
# Aplicația primește calea brută (proxy_pass cu variabilă), iar $uri de mai sus e deja
# normalizat — fără refuzul acesta, /__platform/console/../../ ar ajunge la consolă
# trecând de verificarea pe $uri.
map $request_uri $dot_segment {
    "~*^[^?]*(/|%2f)(\.|%2e){1,2}(/|%2f|\?|$)"  1;
    default                                      0;
}

# X-Forwarded-For spre aplicație = doar IP-ul real al vizitatorului ($remote_addr, luat
# din CF-Connecting-IP mai sus), nu lanțul primit: aplicația ia primul element pentru
# jurnalul de audit (apps/core/audit.py), iar primul element îl scrie vizitatorul.
#
# Încercările de autentificare, pe IP-ul real: 10 pe minut, cu 20 în rafală. Cheia goală
# (orice altă cerere) nu se numără. Limita e pe IP, nu pe cont — tot spitalul poate ieși
# printr-un singur IP; tokenul de reîmprospătare ține 7 zile, deci intrările sunt rare.
map "$request_method:$uri" $login_limit_key {
    "POST:/api/auth/login/"  $binary_remote_addr;
    default                  "";
}
limit_req_zone $login_limit_key zone=caicadre_login:10m rate=10r/m;

# Content-Security-Policy pe documente (HTML și SVG — un SVG încărcat, deschis direct,
# ar rula scripturi în originea aplicației). Interfața: scripturi doar din fișierele
# ei; stilurile inline sunt ale Ant Design (CSS-in-JS); data:/blob: pentru imagini și
# descărcări. Paginile platformei (doar local) au scripturi inline.
map $uri $csp_document {
    "~^/__platform(/|$)"  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    default               "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}
map $sent_http_content_type $csp {
    "~^(text/html|image/svg\+xml)"  $csp_document;
    default                         "";
}

# DNS-ul Docker, reevaluat: după un deploy care recreează doar `app` (IP nou),
# nginx nu rămâne cu adresa veche (502) până la propria repornire. De aceea
# upstream-ul se pune într-o variabilă (`set $app_upstream`), nu într-un
# bloc `upstream` static.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # redirecționările rămân relative (Location: /): nginx vede doar http, vizitatorul e pe https
    absolute_redirect off;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/csv image/svg+xml;
    gzip_min_length 1024;

    # Se moștenesc în location-urile de mai jos, fiindcă acolo nu există niciun add_header
    # (unul singur le-ar anula pe toate acestea).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security $hsts always;
    add_header Content-Security-Policy $csp always;

    limit_req zone=caicadre_login burst=20 nodelay;
    limit_req_status 429;
    error_page 429 @too_many_logins;

    if ($dot_segment) {
        return 400;
    }

    if ($edge_denied) {
        return 404;
    }

    # http:// venit prin Cloudflare → https. Verificările locale, fără antet, nu sunt redirecționate.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        # doar Host-ul de mai sus hotărăște de unde vine cererea, nu un antet pus de vizitator
        proxy_set_header X-Forwarded-Host "";
        proxy_redirect off;
        proxy_read_timeout 90s;      # marginea Cloudflare taie oricum la ~100 s
    }

    # healthcheck-ul containerului `web`, prin proxy până la aplicație
    location = /health {
        access_log off;
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
    }

    # răspunsul limitei de autentificare, în forma erorilor aplicației ({"detail": ...}):
    # ecranul de intrare arată textul
    location @too_many_logins {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 429 '{"detail": "Prea multe încercări de autentificare. Reîncercați peste un minut."}';
    }
}
